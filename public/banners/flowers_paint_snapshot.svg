<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <radialGradient id="flowerBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2228"/>
      <stop offset="60%" stop-color="#181518"/>
      <stop offset="100%" stop-color="#0a080a"/>
    </radialGradient>
    <linearGradient id="rosePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="roseWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="roseYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="irisBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" fill="url(#flowerBg)"/>

  <!-- Floral Still Life Composition -->
  <!-- Dark Leaves -->
  <g fill="url(#leafGreen)" opacity="0.8">
    <ellipse cx="260" cy="180" rx="60" ry="35" transform="rotate(-30 260 180)"/>
    <ellipse cx="480" cy="190" rx="70" ry="40" transform="rotate(35 480 190)"/>
    <ellipse cx="360" cy="100" rx="80" ry="30" transform="rotate(-15 360 100)"/>
    <ellipse cx="580" cy="140" rx="65" ry="30" transform="rotate(45 580 140)"/>
    <ellipse cx="190" cy="220" rx="55" ry="25" transform="rotate(-50 190 220)"/>
  </g>

  <!-- Left Blue/Purple Flowers -->
  <g transform="translate(220, 210)">
    <circle cx="0" cy="0" r="45" fill="url(#irisBlue)"/>
    <circle cx="-15" cy="-10" r="28" fill="#bfdbfe" opacity="0.6"/>
    <circle cx="10" cy="15" r="25" fill="#60a5fa" opacity="0.7"/>
    <circle cx="0" cy="0" r="14" fill="#fbbf24"/>
  </g>

  <!-- Large Center Cream / White Rose Bouquet -->
  <g transform="translate(370, 175)">
    <circle cx="0" cy="0" r="75" fill="url(#roseWhite)"/>
    <circle cx="-20" cy="-15" r="50" fill="#fef3c7" opacity="0.7"/>
    <circle cx="15" cy="15" r="45" fill="#fde68a" opacity="0.8"/>
    <circle cx="0" cy="0" r="28" fill="#f59e0b" opacity="0.9"/>
  </g>

  <!-- Prominent Pink / Red Peony Bouquet -->
  <g transform="translate(510, 160)">
    <circle cx="0" cy="0" r="85" fill="url(#rosePink)"/>
    <circle cx="-25" cy="-20" r="60" fill="#f43f5e" opacity="0.7"/>
    <circle cx="20" cy="15" r="50" fill="#be123c" opacity="0.8"/>
    <circle cx="5" cy="-5" r="30" fill="#fecdd3" opacity="0.9"/>
    <circle cx="0" cy="0" r="16" fill="#f43f5e"/>
  </g>

  <!-- Top Yellow / Coral Tulips -->
  <g transform="translate(440, 95)">
    <ellipse cx="0" cy="0" rx="35" ry="48" fill="url(#roseYellow)" transform="rotate(15 0 0)"/>
    <ellipse cx="-10" cy="5" rx="20" ry="35" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- Small side blossoms & petals -->
  <circle cx="630" cy="220" r="35" fill="url(#rosePink)"/>
  <circle cx="160" cy="150" r="28" fill="url(#irisBlue)"/>
  <circle cx="310" cy="260" r="32" fill="url(#roseYellow)"/>
  <circle cx="480" cy="270" r="40" fill="url(#rosePink)"/>
</svg>
