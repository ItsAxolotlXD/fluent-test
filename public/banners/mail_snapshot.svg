<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="mailBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="notesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="newsRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <rect width="400" height="200" fill="url(#bgScreen)"/>

  <!-- Left app icon (Notes/Doc) -->
  <g transform="translate(45, 45)">
    <rect width="90" height="90" rx="20" fill="#1e293b" />
    <path d="M 25 25 L 65 25 M 25 40 L 65 40 M 25 55 L 50 55" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Center app icon (Mail with notification badge 2) -->
  <g transform="translate(155, 40)">
    <rect width="95" height="95" rx="22" fill="url(#mailBlue)" />
    <!-- Envelope white icon -->
    <path d="M 22 30 L 73 30 C 76 30 78 32 78 35 L 78 65 C 78 68 76 70 73 70 L 22 70 C 19 70 17 68 17 65 L 17 35 C 17 32 19 30 22 30 Z" fill="#ffffff" />
    <path d="M 18 32 L 47.5 54 L 77 32" stroke="url(#mailBlue)" stroke-width="4" stroke-linejoin="round" fill="none"/>
    
    <!-- Red notification badge '2' -->
    <circle cx="85" cy="12" r="16" fill="#ef4444" stroke="#000" stroke-width="2.5"/>
    <text x="85" y="17" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">2</text>
  </g>

  <!-- Right app icon (NEWS) -->
  <g transform="translate(265, 45)">
    <rect width="90" height="90" rx="20" fill="url(#newsRed)" />
    <text x="45" y="45" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" text-anchor="middle">BE</text>
    <text x="45" y="65" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" text-anchor="middle">NEWS</text>
  </g>
</svg>
