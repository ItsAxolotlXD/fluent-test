<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Dark glossy background -->
    <linearGradient id="bgVtv3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Red V Gradient & Bevel -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Green T Gradient & Bevel -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34c759"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Blue V Gradient & Bevel -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007aff"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Red 3 Gradient -->
    <linearGradient id="red3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff453a"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <filter id="vtvGloss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgVtv3)"/>

  <!-- Subtle glow -->
  <circle cx="360" cy="240" r="280" fill="#22c55e" opacity="0.08" filter="blur(60px)"/>
  <circle cx="560" cy="260" r="260" fill="#2563eb" opacity="0.08" filter="blur(60px)"/>
  <circle cx="160" cy="220" r="240" fill="#dc2626" opacity="0.08" filter="blur(60px)"/>

  <g transform="translate(15, 20) scale(1.05)" filter="url(#vtvGloss)">
    <!-- V (Red) -->
    <path d="M 120 70 L 195 70 L 115 360 L 40 360 Z" fill="url(#redGrad)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
    <path d="M 120 70 L 195 70 L 180 120 L 125 120 Z" fill="#ffffff" opacity="0.35" />

    <!-- T (Green) -->
    <path d="M 155 70 L 390 70 L 360 175 L 305 175 L 265 360 L 190 360 L 230 175 L 180 175 Z" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
    <path d="M 155 70 L 390 70 L 380 110 L 165 110 Z" fill="#ffffff" opacity="0.35" />

    <!-- V (Blue) -->
    <path d="M 350 70 L 425 70 L 345 360 L 270 360 Z" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
    <path d="M 350 70 L 425 70 L 410 120 L 355 120 Z" fill="#ffffff" opacity="0.35" />

    <!-- 3 (Red) -->
    <path d="M 455 70 L 590 70 C 650 70 685 105 685 155 C 685 190 660 215 625 225 C 675 235 705 275 705 325 C 705 390 645 420 575 420 L 440 420 L 465 345 L 565 345 C 595 345 625 335 625 295 C 625 255 590 245 550 245 L 505 245 L 525 185 L 560 185 C 590 185 615 175 615 145 C 615 120 590 115 565 115 L 475 115 Z" fill="url(#red3Grad)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
  </g>
</svg>
